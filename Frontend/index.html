<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commission Quote App</title>
  </head>
  <body>
    <!-- 
      1. Application Mount Anchor point: 
      React explicitly hooks into this DOM node ('root') to inject and render 
      the interactive UI component tree managed by App.jsx.
    -->
    <div id="root"></div> 
    
    <!-- 
      2. Module Entry point script:
      Vite utilizes this ES module loading tag to initiate the React runtime compilation pipeline.
      Placing this after the anchor div ensures the DOM node exists before execution begins.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
